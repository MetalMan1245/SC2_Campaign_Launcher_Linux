[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sc2-campaign-launcher"
version = "1.2.0"
description = "Download and launch custom StarCraft II campaigns"
requires-python = ">=3.10"
dependencies = ["PyQt6>=6.2.3,<7"]
license = "GPL-3.0-only"
license-files = ["LICENSE"]
readme = "README.md"

[project.optional-dependencies]
test = ["pytest>=8,<10", "ruff>=0.11,<1"]
build = ["pyinstaller>=6.11,<7", "build>=1.2,<2"]

[project.scripts]
sc2-campaign-launcher = "sc2_campaign_launcher_linux.sc2_campaign_launcher_linux:main"

[tool.setuptools.packages.find]
include = ["sc2_campaign_launcher_linux*"]

[tool.setuptools.data-files]
"share/SC2CampaignLauncher/assets" = ["assets/*.png", "assets/app.ico"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py310"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
